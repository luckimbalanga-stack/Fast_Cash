services:
  - type: web
    name: fast-cash-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python run_all.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # À renseigner dans le dashboard Render (valeur = DATABASE_URL Neon, pooled).
      - key: DATABASE_URL
        sync: false

  - type: web
    name: fast-cash-web
    runtime: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://fast-cash-api.onrender.com
