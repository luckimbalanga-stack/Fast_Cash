services:
  - type: web
    name: fast-cash-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python run_all.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Dashboard Render: renseigner DATABASE_URL (Neon pooled).
      - key: DATABASE_URL
        sync: false
      # Optionnel : Redis / Upstash pour cache partagé (paramètres, dashboard, graphiques).
      - key: REDIS_URL
        sync: false

  # Site statique: pas de plan / healthCheck (CDN uniquement).
  - type: web
    name: fast-cash-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://fast-cash-api.onrender.com
